spring.application.name=campusloop
server.port=${PORT:8081}

# ---- MySQL (set DB_USERNAME / DB_PASSWORD as environment variables, or edit here) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusloop}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA ----
# "update" creates/updates tables automatically. For a real deployment use "validate" + schema.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Session cookie ----
server.servlet.session.timeout=2h
server.servlet.session.cookie.name=CAMPUSLOOP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---- Misc ----
server.error.include-stacktrace=never
server.error.include-message=never
spring.mvc.problemdetails.enabled=false
